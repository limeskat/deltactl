[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delta-plc-driver"
version = "0.1.0"
description = "Delta DVP PLC driver and CLI over Modbus TCP"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pymodbus>=3.16.1,<4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
plc = "delta_plc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/delta_plc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.mypy]
files = ["src/delta_plc"]
disallow_untyped_defs = true
