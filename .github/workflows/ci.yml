name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy src/deltactl

      - name: Run test suite with coverage
        run: pytest --cov-fail-under=85

      - name: Enforce addressing coverage floor (>=90%)
        run: coverage report --include="src/deltactl/addressing.py" --fail-under=90

      - name: Enforce packing coverage floor (>=90%)
        run: coverage report --include="src/deltactl/packing.py" --fail-under=90

      - name: Enforce planning coverage floor (>=90%)
        run: coverage report --include="src/deltactl/planning.py" --fail-under=90
