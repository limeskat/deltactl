name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.10", "3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Show tool versions
        run: |
          python --version
          python -m ruff --version
          python -m mypy --version
          python -m pytest --version

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Check formatting with ruff
        run: python -m ruff format --check .

      - name: Type check with mypy
        run: python -m mypy src/deltactl

      - name: Run test suite with coverage
        run: python -m pytest --cov-fail-under=85

      - name: Enforce per-module coverage floors (>=90%)
        run: |
          python -m coverage report --include="*/deltactl/addressing.py" --fail-under=90
          python -m coverage report --include="*/deltactl/packing.py" --fail-under=90
          python -m coverage report --include="*/deltactl/planning.py" --fail-under=90
